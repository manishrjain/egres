# Build the release tarballs for a version tag and publish them as one
# GitHub release. scripts/install.sh downloads exactly these names:
#
#   egres-<tag>-linux-x86_64.tar.gz    (egres and LICENSE at the top)
#   egres-<tag>-macos-aarch64.tar.gz
#   SHA256SUMS                         (sha256sum format, bare names)
#
# Linux targets glibc 2.28 (2018), so the binary runs on any mainstream
# distro since then rather than only on the runner's own glibc; macOS
# targets 13 on Apple Silicon. The jemalloc bootstrap compiles with
# `zig cc` for the same target (and installs per target), so its probes
# see that platform. Each platform builds in its own job and uploads its
# tarball; one publish job checksums them together and creates the
# release once.
#
# The macOS target keeps the OS "native": with an explicit `macos`, Zig
# uses only its bundled headers, which lack sys/syscall.h and so cannot
# build jemalloc. `native.13.0` keeps the runner's SDK and still sets
# the binary's minimum OS to 13.0.
#
# Every release is created as a pre-release, which GitHub's "latest" and
# therefore the installer's default skip; test it with EGRES_VERSION=<tag>,
# then promote it by hand (the release's edit page, or `gh release edit
# <tag> --prerelease=false --latest`) to make it the one users get.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZIG_TARGET: x86_64-linux-gnu.2.28
      GLIBC_FLOOR: '2.28'
      PLATFORM: linux-x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Not the ci.yml cache: that jemalloc was built for the runner's
      # glibc. This key carries the target.
      - uses: actions/cache@v6
        with:
          path: .deps
          key: >-
            deps-release-${{ env.ZIG_TARGET }}-${{
            hashFiles('build.zig', 'scripts/bootstrap-*.sh') }}

      # The bootstrap compiles jemalloc with `zig cc` for this target.
      - name: Build
        run: >-
          zig build -Drelease -Dtarget=${{ env.ZIG_TARGET }}
          -Dversion=${{ github.ref_name }}

      # The floor is only real if nothing pulled in a newer symbol.
      - name: Check the glibc floor and that the binary runs
        run: |
          newest=$(objdump -T zig-out/bin/egres | grep -o 'GLIBC_[0-9.]*' \
            | sed 's/GLIBC_//' | sort -uV | tail -n 1)
          echo "newest glibc symbol version: $newest (floor $GLIBC_FLOOR)"
          highest=$(printf '%s\n%s\n' "$newest" "$GLIBC_FLOOR" \
            | sort -V | tail -n 1)
          if [ "$highest" != "$GLIBC_FLOOR" ]; then
            echo "::error::needs glibc $newest, above the $GLIBC_FLOOR floor"
            exit 1
          fi
          zig-out/bin/egres --help > /dev/null

      - name: Pack
        run: |
          name="egres-${GITHUB_REF_NAME}-${PLATFORM}"
          mkdir -p stage dist
          cp zig-out/bin/egres LICENSE stage/
          tar -C stage -czf "dist/${name}.tar.gz" egres LICENSE
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ env.PLATFORM }}
          path: dist/*.tar.gz
          if-no-files-found: error

  macos-aarch64:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ZIG_TARGET: aarch64-native.13.0
      PLATFORM: macos-aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions/cache@v6
        with:
          path: .deps
          key: >-
            deps-release-${{ env.ZIG_TARGET }}-${{
            hashFiles('build.zig', 'scripts/bootstrap-*.sh') }}

      # The bootstrap compiles jemalloc with `zig cc` for this target.
      - name: Build
        run: >-
          zig build -Drelease -Dtarget=${{ env.ZIG_TARGET }}
          -Dversion=${{ github.ref_name }}

      # The binary's own minimum macOS, as the loader enforces it.
      - name: Check the macOS floor and that the binary runs
        run: |
          otool -l zig-out/bin/egres | grep -A4 LC_BUILD_VERSION
          file zig-out/bin/egres
          zig-out/bin/egres --help > /dev/null

      - name: Pack
        run: |
          name="egres-${GITHUB_REF_NAME}-${PLATFORM}"
          mkdir -p stage dist
          cp zig-out/bin/egres LICENSE stage/
          tar -C stage -czf "dist/${name}.tar.gz" egres LICENSE
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ env.PLATFORM }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [linux-x86_64, macos-aarch64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF_NAME}
          cat > notes.md <<EOF
          Install: \`curl -fsSL https://egresql.io/install.sh | sh\`
          (pin with \`EGRES_VERSION=$tag\`).

          macOS: the binary is not signed. The installer runs it without
          a prompt; a tarball saved from a browser is quarantined, so run
          \`xattr -d com.apple.quarantine egres\` on the binary first.
          EOF
          gh release create "$tag" --verify-tag --title "$tag" --prerelease \
            --notes-file notes.md dist/*.tar.gz dist/SHA256SUMS
