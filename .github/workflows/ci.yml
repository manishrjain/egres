# Every push to main, and every pull request, runs the same gate as a
# local push: scripts/prepush.sh — exe builds (default + jemalloc
# allocator) and the full test suite including big tests
# (`zig build test -- --bigtest`). A fork's PR runs with a read-only
# token and no secrets, which this workflow never needed.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes its running build; pushes to main
# each run to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Linux is the deployment target; macOS is a development target,
    # and the Apple Silicon runner is the only place its kqueue and
    # 16 KiB-page paths run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Installs the pinned compiler and caches the global Zig cache
      # (fetched build.zig.zon packages land there) between runs.
      # Still declares the node20 runtime as of v2.2.1 (runs fine on
      # the runner's node24, but emits a deprecation notice) — drop
      # this note once upstream migrates.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Native deps (mimalloc/jemalloc) build once into .deps/ from
      # tarballs pinned in build.zig; cache them on those pins.
      - uses: actions/cache@v6
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('build.zig', 'scripts/bootstrap-*.sh') }}

      - name: prepush (builds + full test suite incl. big tests)
        run: ./scripts/prepush.sh

  # The SQL harness under the simulation (scripts/sim_sql.sh): a whole
  # node on a simulated disk and network, pgwire clients, power cuts
  # and, in the second step, disk errors. Its tests skip without a
  # seed, so the test job above does not run them. The seeds are
  # fixed: a failure is a regression, and it replays on any machine
  # with the command the script prints. Linux only: the simulation
  # stands in for the disk, the network and the clock. Fresh seeds
  # every night are sim.yml's.
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions/cache@v6
        with:
          path: .deps
          key: >-
            deps-${{ runner.os }}-${{
            hashFiles('build.zig', 'scripts/bootstrap-*.sh') }}

      # sim_sql.sh keeps a failing seed's log under $TMPDIR.
      - name: Crashes, seeds 1 to 10
        env:
          TMPDIR: ${{ runner.temp }}/sim-logs
        run: |
          mkdir -p "$TMPDIR"
          scripts/sim_sql.sh 1 10

      - name: Crashes and disk errors, seeds 1 to 10
        env:
          TMPDIR: ${{ runner.temp }}/sim-logs
        run: |
          mkdir -p "$TMPDIR"
          scripts/sim_sql.sh 1 10 random "BIG: sim: sql rides"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sim-logs
          path: ${{ runner.temp }}/sim-logs
          if-no-files-found: ignore

  # The end-to-end scripts (scripts/e2e.sh): a real server driven over
  # pgwire by psql, then on Linux the Postgres conformance replay
  # (scripts/sqllogic_e2e.sh). A job of its own, beside the tests, so a
  # red check says which kind failed, and not in prepush.sh, which
  # gates a local push.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions/cache@v6
        with:
          path: .deps
          key: >-
            deps-${{ runner.os }}-${{
            hashFiles('build.zig', 'scripts/bootstrap-*.sh') }}

      # The scripts use psql 18 meta-commands (\parse, \close_prepared,
      # \startpipeline); the Ubuntu image ships 16, so Linux takes
      # PGDG's client. The Mac gets a current one from brew's libpq.
      - name: Find psql
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            sudo install -d "$(dirname "$key")"
            sudo curl -fsS -o "$key" \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            . /etc/os-release
            echo "deb [signed-by=$key]" \
              "https://apt.postgresql.org/pub/repos/apt" \
              "$VERSION_CODENAME-pgdg main" |
              sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update -q
            sudo apt-get install -y -q postgresql-client-18
          else
            brew install -q libpq
            echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"
          fi

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: e2e
        env:
          DATA: ${{ runner.temp }}/e2e
        run: ./scripts/e2e.sh

      # Postgres conformance (tests/sqllogic): Postgres's regress files
      # replayed from recorded .pgout files, so no Postgres server is
      # needed, only psycopg, which the script installs into a venv.
      # Linux only: pure-Python psycopg loads the system libpq, which
      # the client package above brings; brew's keg-only libpq is not
      # on the Mac's library path.
      - name: sqllogic
        if: runner.os == 'Linux'
        env:
          DATA: ${{ runner.temp }}/sqllogic
        run: ./scripts/sqllogic_e2e.sh

      # The scripts write the server's output to this one path; a
      # panic or a hang is only readable from it.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-server-log-${{ matrix.os }}
          path: /tmp/zdb/server.log
          if-no-files-found: ignore
